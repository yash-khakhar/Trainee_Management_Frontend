<div class="bg-white shadow-sm border border-gray-200 rounded-lg overflow-hidden flex flex-col">
    <!-- Optional Header/Filters Slot -->
    <div class="px-6 py-4 bg-gray-50 border-b border-gray-200 flex justify-between items-center">
        <h2 class="text-lg font-medium text-gray-900">{{ title() }}</h2>
        <ng-content select="[filters]"></ng-content>
    </div>

    <!-- Table -->
    <div class="overflow-x-auto flex-1">
        <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50">
                <tr>
                    @for (col of columns(); track col.key) {
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">{{ col.label }}</th>
                    }
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-200 bg-white">
                @if (isLoading()) {
                <tr>
                    <td [attr.colspan]="columns().length" class="px-6 py-12 text-center text-sm text-gray-500">
                    <div class="flex justify-center items-center space-x-2">
                        <svg class="animate-spin h-5 w-5 text-indigo-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                        <span>Loading data...</span>
                    </div>
                    </td>
                </tr>
                } @else {
                    <ng-content></ng-content>
                }
            </tbody>
        </table>
    </div>

    <!-- Pagination Footer -->
    <div class="px-6 py-3 bg-gray-50 border-t border-gray-200 flex justify-between items-center text-sm text-gray-700">
        <div>Showing page <strong>{{ pageNumber() }}</strong> of <strong>{{ totalPages() }}</strong> (Total: {{
            totalRecords() }})</div>
        <div class="flex gap-2">
            <button (click)="pageChange.emit(pageNumber() - 1)" [disabled]="pageNumber() <= 1"
                class="px-3 py-1 border border-gray-300 rounded-md bg-white disabled:opacity-50 disabled:cursor-not-allowed hover:bg-gray-100">
                Previous
            </button>
            <button (click)="pageChange.emit(pageNumber() + 1)" [disabled]="pageNumber() >= totalPages()"
                class="px-3 py-1 border border-gray-300 rounded-md bg-white disabled:opacity-50 disabled:cursor-not-allowed hover:bg-gray-100">
                Next
            </button>
        </div>
    </div>
</div>
