<div class="relative" #dropdownContainer>
    
    <div (click)="toggleOpen()"
        class="w-full px-4 py-2.5 rounded-xl border border-gray-300 text-gray-900 bg-white cursor-pointer flex items-center justify-between focus:outline-none focus:ring-2 focus:ring-indigo-500 transition duration-200">
        <span [class.text-gray-400]="!selectedLabel()">
            {{ selectedLabel() || placeholder }}
        </span>
        <svg class="w-4 h-4 text-gray-500 transform transition-transform duration-200" [class.rotate-180]="isOpen()"
            fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
        </svg>
    </div>

   
    @if (isOpen()) {

        <div
            class="absolute z-50 mt-2 w-full bg-white rounded-xl shadow-2xl border border-gray-100 overflow-hidden animate-fadeIn">
            <div class="p-2.5 border-b border-gray-100 bg-gray-50">
                <div class="relative">
                    <svg class="absolute left-3 top-3 w-4 h-4 text-gray-400" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                    <input type="text" #searchInput [value]="searchTerm()" (input)="searchTerm.set(searchInput.value)"
                        placeholder="Type to search..."
                        class="w-full pl-9 pr-4 py-2 text-sm bg-white rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-gray-900"
                        (click)="$event.stopPropagation()" />
                </div>
            </div>

        
            <div class="max-h-60 overflow-y-auto divide-y divide-gray-50">
                @if (filteredOptions().length === 0) {
                    <div class="p-4 text-center text-sm text-gray-500">No results found</div>
                } @else {
                    @for (option of filteredOptions(); track option.id) {
                        <div (click)="selectOption(option)"
                            class="px-4 py-2.5 hover:bg-indigo-50 cursor-pointer text-sm flex flex-col transition duration-150">
                            <span class="font-medium text-gray-900">{{ option.label }}</span>
                            @if (option.subLabel) {
                            <span class="text-xs text-gray-500">{{ option.subLabel }}</span>
                            }
                        </div>
                    }
                }
            </div>
        </div>

    }
    
</div>
