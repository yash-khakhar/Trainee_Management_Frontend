<div class="min-h-screen bg-gray-100 flex items-center justify-center px-4">

    <div class="bg-white rounded-xl shadow-lg p-10 max-w-md w-full text-center">

        <div class="text-red-600 text-7xl font-bold">
            403
        </div>

        <h1 class="mt-4 text-3xl font-bold text-gray-800">
            Access Denied
        </h1>

        <p class="mt-3 text-gray-600">
            You don't have permission to access this page.
        </p>

        <p class="mt-2 text-sm text-gray-500">
            Please return to your dashboard or sign out and log in with another account.
        </p>

        <div class="mt-8 flex flex-col gap-3">

            <button
                (click)="goToDashboard()"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-lg transition duration-200 cursor-pointer">

                Go to Dashboard

            </button>

            <button
                (click)="logout()"
                class="w-full border border-red-600 text-red-600 hover:bg-red-600 hover:text-white font-medium py-3 rounded-lg transition duration-200 cursor-pointer">

                Logout

            </button>

        </div>

    </div>

</div>
