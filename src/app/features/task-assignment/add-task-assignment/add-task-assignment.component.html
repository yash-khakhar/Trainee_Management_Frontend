<app-admin-layout>
    <div
        class="max-w-4xl mx-auto p-8 bg-white rounded-2xl shadow-xl border border-gray-100 transition-all duration-300 w-full">

        <!-- Header Section -->
        <div class="border-b border-gray-100 pb-5 mb-6 flex justify-between items-center">
            <div>
                <h2 class="text-2xl font-extrabold text-gray-900 tracking-tight">Assign Learning Task</h2>
                <p class="text-sm text-gray-500 mt-1">Map trainees and mentors to specific learning tasks.</p>
            </div>
        </div>

        <!-- Dynamic Error Alert -->
        @if (errorMessage()) {
        <div
            class="mb-6 p-4 rounded-xl bg-red-50 border border-red-200 text-sm font-medium text-red-700 flex items-center gap-2">
            <svg class="w-5 h-5 flex-shrink-0 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <span>{{ errorMessage() }}</span>
        </div>
        }

        <!-- Dynamic Success Alert -->
        @if (successMessage()) {
        <div
            class="mb-6 p-4 rounded-xl bg-emerald-50 border border-emerald-200 text-sm font-medium text-emerald-700 flex items-center gap-2">
            <svg class="w-5 h-5 flex-shrink-0 text-emerald-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
            </svg>
            <span>{{ successMessage() }}</span>
        </div>
        }

        <!-- Form Section -->
        <form [formGroup]="assignmentForm" (ngSubmit)="onSubmit()" class="space-y-6">

            <!-- Section 1: Mapping Selections -->
            <!-- Section 1: Mapping Selections -->
            <div>
                <h3 class="text-sm font-bold uppercase tracking-wider text-indigo-600 mb-4">Assignment Details</h3>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">

                    <!-- Trainee Dropdown with Search -->
                    <div class="flex flex-col gap-1.5">
                        <label class="text-sm font-semibold text-gray-700">Trainee</label>
                        <app-searchable-dropdown formControlName="traineeId" [options]="traineeOptions()"
                            placeholder="Select Trainee">
                        </app-searchable-dropdown>
                    </div>

                    <!-- Mentor Dropdown with Search -->
                    <div class="flex flex-col gap-1.5">
                        <label class="text-sm font-semibold text-gray-700">Mentor</label>
                        <app-searchable-dropdown formControlName="mentorId" [options]="mentorOptions()"
                            placeholder="Select Mentor">
                        </app-searchable-dropdown>
                    </div>

                    <!-- Task Dropdown with Search -->
                    <div class="flex flex-col gap-1.5">
                        <label class="text-sm font-semibold text-gray-700">Learning Task</label>
                        <app-searchable-dropdown formControlName="taskId" [options]="taskOptions()"
                            placeholder="Select Task">
                        </app-searchable-dropdown>
                    </div>

                </div>
            </div>

            <!-- Section 2: Timeline & Status Info -->
            <div class="pt-2">
                <h3 class="text-sm font-bold uppercase tracking-wider text-indigo-600 mb-4">Timeline & Status</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

                    <!-- Assigned Date Field -->
                    <app-input id="assignedDate" label="Assigned Date" type="date"
                        errorMessage="Assigned date is required." formControlName="assignedDate"></app-input>

                    <!-- Status Dropdown Field -->
                    <div class="flex flex-col gap-1.5">
                        <label for="status" class="text-sm font-semibold text-gray-700">Status</label>
                        <div class="relative">
                            <select id="status" formControlName="status"
                                class="w-full px-4 py-2.5 rounded-xl border border-gray-300 text-gray-900 bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition duration-200 appearance-none cursor-pointer">
                                @for (s of statuses; track s.value) {
                                <option [value]="s.value">{{ s.label }}</option>
                                }
                            </select>
                        </div>
                    </div>

                </div>
            </div>

            <!-- Section 3: Remarks -->
            <div class="pt-2">
                <h3 class="text-sm font-bold uppercase tracking-wider text-indigo-600 mb-4">Additional Information</h3>
                <div class="grid grid-cols-1 gap-4">
                    <div class="flex flex-col gap-1.5">
                        <label for="remarks" class="text-sm font-semibold text-gray-700">Remarks</label>
                        <textarea id="remarks" formControlName="remarks" rows="3" placeholder="Enter remarks if any..."
                            class="w-full px-4 py-2.5 rounded-xl border border-gray-300 text-gray-900 bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition duration-200"></textarea>
                    </div>
                </div>
            </div>

            <!-- Submit Action Footer -->
            <div class="pt-6 border-t border-gray-100 flex items-center justify-end">
                <app-button
                    customClass="py-3 px-8 font-semibold rounded-xl shadow-md hover:shadow-lg focus:outline-none focus:ring-2 focus:ring-offset-2 transition duration-200 flex justify-center items-center gap-2 disabled:cursor-not-allowed disabled:shadow-none bg-indigo-600 hover:bg-indigo-700 disabled:bg-indigo-400 text-white focus:ring-indigo-500"
                    type="submit" [disabled]="assignmentForm.invalid" [isLoading]="isLoading()"
                    loadingText="Assigning Task..." [fullWidth]="false">
                    Assign Task
                </app-button>
            </div>
        </form>
    </div>
</app-admin-layout>
