<app-admin-layout>
    <!-- Main Wrapper: Expanded to max-w-4xl for a balanced dashboard feel -->
    <div class="max-w-4xl mx-auto p-8 bg-white rounded-2xl shadow-xl border border-gray-100 transition-all duration-300 w-full">

        <!-- Header Section -->
        <div class="border-b border-gray-100 pb-5 mb-6">
            <h2 class="text-2xl font-extrabold text-gray-900 tracking-tight">Create New User Profile</h2>
            <p class="text-sm text-gray-500 mt-1">Add a new user to the platform and assign their system permissions.</p>
        </div>

        <!-- Form Section arranged in a 2-Column Grid -->
        <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="space-y-6">

            <!-- Section 1: Personal Information -->
            <div>
                <h3 class="text-sm font-bold uppercase tracking-wider text-indigo-600 mb-4">Personal Information</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- First Name Field -->
                    <app-input id="firstName" label="First Name" type="text" placeholder="Enter first name"
                        [control]="$any(registerForm.controls.firstName)" errorMessage="First Name is required."
                        formControlName="firstName"></app-input>

                    <!-- Last Name Field -->
                    <app-input id="lastName" label="Last Name" type="text" placeholder="Enter last name"
                        [control]="$any(registerForm.controls.lastName)" errorMessage="Last Name is required."
                        formControlName="lastName"></app-input>
                </div>
            </div>

            <!-- Section 2: Account Credentials -->
            <div class="pt-2">
                <h3 class="text-sm font-bold uppercase tracking-wider text-indigo-600 mb-4">Account Credentials</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- Username Field -->
                    <app-input id="userName" label="Username" type="text" placeholder="Choose a username"
                        [control]="$any(registerForm.controls.username)" errorMessage="Username is required."
                        formControlName="username"></app-input>

                    <!-- Email Field -->
                    <app-input id="email" label="Email Address" type="email" placeholder="name@company.com"
                        [control]="$any(registerForm.controls.email)" errorMessage="Valid email is required."
                        formControlName="email"></app-input>

                    <!-- Password Field -->
                    <app-input id="password" label="Password" type="password" placeholder="At least 6 characters"
                        [control]="$any(registerForm.controls.password)" errorMessage="Password must be at least 6 characters."
                        formControlName="password"></app-input>

                    <!-- Tech Stack Field -->
                    <app-input id="techStack" label="Tech Stack" type="text" placeholder="e.g. Angular, Node.js"
                        [control]="$any(registerForm.controls.techStack)" errorMessage="Tech Stack is required."
                        formControlName="techStack"></app-input>
                </div>
            </div>

            <!-- Section 3: Access & Permissions -->
            <div class="pt-2">
                <h3 class="text-sm font-bold uppercase tracking-wider text-indigo-600 mb-4">Access & Permissions</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    
                    <!-- Status Dropdown Selector Field -->
                    <div class="flex flex-col gap-1.5">
                        <label for="status" class="text-sm font-semibold text-gray-700">Status</label>
                        <div class="relative">
                            <select id="status" formControlName="status"
                                class="w-full px-4 py-2.5 rounded-xl border border-gray-300 text-gray-900 bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition duration-200 appearance-none cursor-pointer">
                                @for (s of status; track s.value) {
                                <option [value]="s.value">{{ s.label }}</option>
                                }
                            </select>
                            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-gray-500">
                                <svg class="fill-current h-4 w-4" viewBox="0 0 20 20">
                                    <path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z" />
                                </svg>
                            </div>
                        </div>
                    </div>

                    <!-- Role Dropdown Selector Field -->
                    <div class="flex flex-col gap-1.5">
                        <label for="role" class="text-sm font-semibold text-gray-700">Role</label>
                        <div class="relative">
                            <select id="role" formControlName="role"
                                class="w-full px-4 py-2.5 rounded-xl border border-gray-300 text-gray-900 bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition duration-200 appearance-none cursor-pointer">
                                @for (r of roles; track r.value) {
                                <option [value]="r.value">{{ r.label }}</option>
                                }
                            </select>
                            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-gray-500">
                                <svg class="fill-current h-4 w-4" viewBox="0 0 20 20">
                                    <path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z" />
                                </svg>
                            </div>
                        </div>
                    </div>

                </div>
            </div>

            <!-- Submit Action Footer -->
            <div class="pt-6 border-t border-gray-100 flex items-center justify-end">
                <app-button
                    customClass="py-3 px-8 font-semibold rounded-xl shadow-md hover:shadow-lg focus:outline-none focus:ring-2 focus:ring-offset-2 transition duration-200 flex justify-center items-center gap-2 disabled:cursor-not-allowed disabled:shadow-none bg-indigo-600 hover:bg-indigo-700 disabled:bg-indigo-400 text-white focus:ring-indigo-500"
                    type="submit" [disabled]="registerForm.invalid" [isLoading]="isLoading()"
                    loadingText="Creating Account..." [fullWidth]="false">
                    Create User Profile
                </app-button>
            </div>
        </form>
    </div>
</app-admin-layout>
