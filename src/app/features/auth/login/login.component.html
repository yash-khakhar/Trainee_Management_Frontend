<div class="max-w-md mx-auto my-12 p-8 bg-white rounded-2xl shadow-xl border border-gray-100 transition-all duration-300">

    <h2 class="text-3xl font-extrabold text-gray-900 text-center mb-6 tracking-tight">Sign In</h2>

    <!-- Dynamic Error Alert -->
    @if (errorMessage()) {
    <div
        class="mb-5 p-4 rounded-xl bg-red-50 border border-red-200 text-sm font-medium text-red-700 flex items-center gap-2">
        <svg class="w-5 h-5 flex-shrink-0 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <span>{{ errorMessage() }}</span>
    </div>
    }

    <!-- Form Section -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

        <!-- Shared Username Input -->
        <app-input id="userName" label="Username" type="text" placeholder="Enter username"
            [control]="$any(loginForm.controls.userName)" errorMessage="Username is required."
            formControlName="userName" class="block mb-7"></app-input>

        <!-- Shared Password Input -->
        <app-input id="password" label="Password" type="password" placeholder="Enter password"
            [control]="$any(loginForm.controls.password)" errorMessage="Password is required."
            formControlName="password" class="block mb-7"></app-input>

        <!-- Our Shared Multipurpose Button from earlier -->
        <app-button 
            customClass="py-3 px-4 font-semibold rounded-xl shadow-md hover:shadow-lg focus:outline-none focus:ring-2 focus:ring-offset-2 transition duration-200 flex justify-center items-center gap-2 disabled:cursor-not-allowed disabled:shadow-none bg-indigo-600 hover:bg-indigo-700 disabled:bg-indigo-400 text-white focus:ring-indigo-500 w-full mt-2"
            type="submit" [disabled]="loginForm.invalid" [isLoading]="isLoading()" loadingText="Logging in..."
            [fullWidth]="true">
            Login
        </app-button>

    </form>

</div>
