<app-data-table 
    title="Mentor List" 
    [columns]="[
        { key: 'mentor', label: 'Mentor' },
        { key: 'techStack', label: 'Tech Stack' },
        { key: 'status', label: 'Status' }
    ]" 
    [pageNumber]="currentPage()" 
    [pageSize]="pageSize()" 
    [totalRecords]="mentorData()?.totalRecords || 0"
    [isLoading]="isLoading()" 
    (pageChange)="changePage($event)"
>
    <!-- Search & Status Filter Controls -->
    <div filters class="flex items-center gap-2 w-full sm:w-auto">
        <input type="text" [value]="searchQuery()" (input)="onSearchChange($event)" placeholder="Search mentors..."
            class="px-3 py-1.5 text-sm border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-indigo-500 w-full sm:w-48" />

        <select [value]="selectedStatus()" (change)="onStatusChange($event)"
            class="px-3 py-1.5 text-sm border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-indigo-500 bg-white">
            <option [value]="">
                All</option>
            <option [value]="MentorStatusEnum.ACTIVE" [selected]="selectedStatus() === MentorStatusEnum.ACTIVE">
                Active</option>
            <option [value]="MentorStatusEnum.INACTIVE" [selected]="selectedStatus() === MentorStatusEnum.INACTIVE">
                Inactive</option>
        </select>
    </div>

    <!-- Table Body Rows -->
    <!-- Table Body Rows -->
    @if (mentorData(); as list) {

        @for (mentor of list.data; track mentor.id) {
            <tr (click)="selectMentor(mentor.id)" class="hover:bg-gray-50 cursor-pointer transition-colors">
                <td class="px-6 py-4 whitespace-nowrap">
                    <div class="text-sm font-medium text-gray-900">{{ mentor.firstName }} {{ mentor.lastName }}</div>
                    <div class="text-xs text-gray-500">{{ mentor.email }}</div>
                </td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-600">
                    {{ mentor.expertise }}
                </td>
                <td class="px-6 py-4 whitespace-nowrap">
                    <span
                        [class]="mentor.status === MentorStatusEnum.ACTIVE ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'"
                        class="px-2.5 py-0.5 rounded-full text-xs font-medium">
                        {{ mentor.status }}
                    </span>
                </td>
            </tr>
        }

        @if (!list.data || list.data.length === 0) {
            <tr>
                <td colspan="3" class="px-6 py-8 text-center text-sm text-gray-500">No Mentor found.</td>
            </tr>
        }

    }

</app-data-table>
