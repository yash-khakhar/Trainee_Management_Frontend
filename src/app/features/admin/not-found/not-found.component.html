<app-admin-layout>
    <!-- Centered container fitting the admin dashboard layout rhythm -->
    <div class="flex flex-col items-center justify-center min-h-[60vh] text-center px-4">
        
        <!-- Icon / Visual Indicator -->
        <div class="w-20 h-20 bg-indigo-50 rounded-2xl flex items-center justify-center text-indigo-600 mb-6 shadow-sm border border-indigo-100">
            <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                    d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z">
                </path>
            </svg>
        </div>

        <!-- Error Code & Heading -->
        <span class="text-sm font-bold uppercase tracking-wider text-indigo-600 mb-2">Error 404</span>
        <h1 class="text-3xl font-extrabold text-gray-900 tracking-tight sm:text-4xl mb-3">Page not found</h1>
        <p class="text-base text-gray-500 max-w-md mb-8">
            Sorry, we couldn’t find the page you’re looking for. It might have been moved, deleted, or never existed.
        </p>

        <!-- Action Button leveraging your custom app-button component -->
        <div class="w-full max-w-xs">
            <app-button
                customClass="py-3 px-6 font-semibold rounded-xl shadow-md hover:shadow-lg focus:outline-none focus:ring-2 focus:ring-offset-2 transition duration-200 flex justify-center items-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white focus:ring-indigo-500 w-full"
                type="button" [fullWidth]="true" (click)="goBack()">
                Back to Dashboard
            </app-button>
        </div>

    </div>
</app-admin-layout>
