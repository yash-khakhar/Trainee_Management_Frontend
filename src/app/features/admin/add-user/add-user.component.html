<app-admin-layout>
    <!-- Main Wrapper matching the login card size, shadows, and smooth borders -->
    <div
        class="max-w-md mx-auto p-8 bg-white rounded-2xl shadow-xl border border-gray-100 transition-all duration-300 w-full">

        <!-- Header Section -->
        <h2 class="text-3xl font-extrabold text-gray-900 text-center mb-6 tracking-tight">Create Account</h2>

        <!-- Dynamic Error Alert -->
        @if (errorMessage()) {
        <div
            class="mb-5 p-4 rounded-xl bg-red-50 border border-red-200 text-sm font-medium text-red-700 flex items-center gap-2">
            <svg class="w-5 h-5 flex-shrink-0 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <span>{{ errorMessage() }}</span>
        </div>
        }

        <!-- Form Section with consistent vertical spacing -->
        <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">

            <!-- Username Field -->
            <app-input id="userName" label="Username" type="text" placeholder="Choose a username"
                [control]="$any(registerForm.controls.username)" errorMessage="Username is required."
                formControlName="username"></app-input>

            <!-- Responsive Flex Row: First Name & Last Name -->
            <div class="grid grid-cols-2 gap-4">
                <!-- First Name Field -->
                <app-input id="firstName" label="First Name" type="text" placeholder="Enter your first name"
                    [control]="$any(registerForm.controls.firstName)" errorMessage="First Name is required."
                    formControlName="firstName"></app-input>

                <!-- Last Name Field -->
                <app-input id="lastName" label="Last Name" type="text" placeholder="Enter your last name"
                    [control]="$any(registerForm.controls.lastName)" errorMessage="Last Name is required."
                    formControlName="lastName"></app-input>
            </div>

            <!-- Email Field -->
            <app-input id="email" label="Email" type="email" placeholder="Enter your email"
                [control]="$any(registerForm.controls.email)" errorMessage="Email is required."
                formControlName="email"></app-input>

            <!-- Password Field -->
            <app-input id="password" label="Password" type="password" placeholder="Enter your password"
                [control]="$any(registerForm.controls.password)" errorMessage="Password is required."
                formControlName="password"></app-input>

            <!-- Tech Stack Field -->
            <app-input id="techStack" label="Tech Stack" type="text" placeholder="Enter your Tech Stack"
                [control]="$any(registerForm.controls.techStack)" errorMessage="Tech Stack is required."
                formControlName="techStack"></app-input>

            <!-- Status Dropdown Selector Field -->
            <div class="flex flex-col gap-1.5 mt-4">
                <label for="status" class="text-sm font-semibold text-gray-700">Status</label>
                <div class="relative">
                    <select id="status" formControlName="status"
                        class="w-full px-4 py-2.5 rounded-xl border border-gray-300 text-gray-900 bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition duration-200 appearance-none cursor-pointer">
                        @for (s of status; track s.value) {
                        <option [value]="s.value">{{ s.label }}</option>
                        }
                    </select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-gray-500">
                        <svg class="fill-current h-4 w-4" viewBox="0 0 20 20">
                            <path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z" />
                        </svg>
                    </div>
                </div>
            </div>

            <!-- Role Dropdown Selector Field -->
            <div class="flex flex-col gap-1.5 mt-4">
                <label for="role" class="text-sm font-semibold text-gray-700">Role</label>
                <div class="relative">
                    <select id="role" formControlName="role"
                        class="w-full px-4 py-2.5 rounded-xl border border-gray-300 text-gray-900 bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition duration-200 appearance-none cursor-pointer">
                        @for (r of roles; track r.value) {
                        <option [value]="r.value">{{ r.label }}</option>
                        }
                    </select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-gray-500">
                        <svg class="fill-current h-4 w-4" viewBox="0 0 20 20">
                            <path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z" />
                        </svg>
                    </div>
                </div>
            </div>

            <app-button
                customClass="py-3 px-4 font-semibold rounded-xl shadow-md hover:shadow-lg focus:outline-none focus:ring-2 focus:ring-offset-2 transition duration-200 flex justify-center items-center gap-2 disabled:cursor-not-allowed disabled:shadow-none bg-indigo-600 hover:bg-indigo-700 disabled:bg-indigo-400 text-white focus:ring-indigo-500 w-full mt-6"
                type="submit" [disabled]="registerForm.invalid" [isLoading]="isLoading()"
                loadingText="Creating Account..." [fullWidth]="true">
                Create User Profile
            </app-button>
        </form>
    </div>
</app-admin-layout>
