<app-admin-layout>
    <!-- Header -->
    <div class="flex justify-between items-center">
        <div>
            <h1 class="text-2xl font-bold text-gray-900">Admin Dashboard</h1>
            <p class="mt-1 text-sm text-gray-600">Manage trainees, mentors, tasks, and assignments.</p>
        </div>
        <span class="hidden sm:inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-indigo-100 text-indigo-800">
            Admin Control Center
        </span>
    </div>

    <!-- Quick Action Buttons -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
        <app-button
            customClass="p-4 bg-white border border-gray-200 rounded-lg shadow-sm hover:border-indigo-500 hover:shadow-md transition-all text-left block w-full focus:outline-none focus:ring-2 focus:ring-indigo-500"
            (btnClick)="openAddTaskModal()">
            <div class="text-indigo-600 font-semibold hover:text-indigo-700">+ Add New Task</div>
            <p class="text-xs text-gray-500 mt-1">Create a new learning task.</p>
        </app-button>

        <app-button
            customClass="p-4 bg-white border border-gray-200 rounded-lg shadow-sm hover:border-indigo-500 hover:shadow-md transition-all text-left block w-full focus:outline-none focus:ring-2 focus:ring-indigo-500"
            (btnClick)="openAddUserModal()">
            <div class="text-indigo-600 font-semibold hover:text-indigo-700">+ Add Trainee / Mentor</div>
            <p class="text-xs text-gray-500 mt-1">Onboard new users to the platform.</p>
        </app-button>

        <app-button
            customClass="p-4 bg-white border border-gray-200 rounded-lg shadow-sm hover:border-indigo-500 hover:shadow-md transition-all text-left block w-full focus:outline-none focus:ring-2 focus:ring-indigo-500"
            (btnClick)="openAssignTaskModal()">
            <div class="text-indigo-600 font-semibold hover:text-indigo-700">Assign Task</div>
            <p class="text-xs text-gray-500 mt-1">Distribute tasks to specific trainees.</p>
        </app-button>

        <app-button
            customClass="p-4 bg-white border border-gray-200 rounded-lg shadow-sm hover:border-indigo-500 hover:shadow-md transition-all text-left block w-full focus:outline-none focus:ring-2 focus:ring-indigo-500"
            (btnClick)="openAssignMentorModal()">
            <div class="text-indigo-600 font-semibold hover:text-indigo-700">Assign Mentor</div>
            <p class="text-xs text-gray-500 mt-1">Link mentors with designated trainees.</p>
        </app-button>
    </div>

    <!-- Content Sections -->
    <div class="grid grid-cols-1 lg:grid-cols-1 gap-8">

        <!-- Trainees Section using Reusable Data Table Component -->
        <app-trainees-list></app-trainees-list>

    </div>
</app-admin-layout>
